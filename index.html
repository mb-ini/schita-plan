<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>Releveu instalații · 18.10, 21:00</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><style id="app-css">
/* Layout: one-screen field tool. Slim header, a row of rooms to jump to, the plan filling the rest,
   a big add-palette above the tab bar. Editors rise as bottom sheets on a phone and sit as a right panel on wide screens.
   Identity: blueprint ink on a cool grey drafting ground, condensed display type like a title block, mono for measurements. */
:root{
  --bg:#e8ecee; --surface:#fbfcfc; --surface-2:#f0f3f4; --ink:#1b2530; --muted:#5b6773; --line:#d2d8dc;
  --accent:#2747c8; --accent-ink:#ffffff; --accent-soft:#dde4fb;
  --fl-tile:#f2e6c0; --fl-wood:#dbd2bd; --wall:#1b2530; --thin:#4f5a65;
  --work:#c9372c; --work-soft:rgba(201,55,44,.16);
  --st-ex:#1b2530; --st-ex-fg:#ffffff; --st-new:#0d8465; --st-move:#c27705; --st-del:#c22f2f; --mk-fg:#ffffff;
  --ok:#0d8465; --warn:#b26a00; --bad:#c22f2f; --cote:#6a3fb5; --gh:#c4511f; --gh-fg:#ffffff; --hgt:#0a6f86; --hgt-fg:#ffffff;
  --scrim:rgba(15,22,30,.32); --shadow:0 12px 32px rgba(18,28,40,.20);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --kb:0px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1418; --surface:#171e24; --surface-2:#1f272e; --ink:#e3e8ec; --muted:#98a3ad; --line:#2c363f;
  --accent:#8ea5ff; --accent-ink:#0f1418; --accent-soft:#232c55;
  --fl-tile:#38321f; --fl-wood:#2c2924; --wall:#cdd5db; --thin:#8a95a0;
  --work:#ff7266; --work-soft:rgba(255,114,102,.22);
  --st-ex:#dfe5ea; --st-ex-fg:#0f1418; --st-new:#2fc79d; --st-move:#f2a83a; --st-del:#ff6b6b; --mk-fg:#0f1418;
  --ok:#2fc79d; --warn:#f2a83a; --bad:#ff6b6b; --cote:#b99cff; --gh:#ff8a5c; --gh-fg:#1a0f0a; --hgt:#5ccbe0; --hgt-fg:#0f1418;
  --scrim:rgba(0,0,0,.5); --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1418; --surface:#171e24; --surface-2:#1f272e; --ink:#e3e8ec; --muted:#98a3ad; --line:#2c363f;
  --accent:#8ea5ff; --accent-ink:#0f1418; --accent-soft:#232c55;
  --fl-tile:#38321f; --fl-wood:#2c2924; --wall:#cdd5db; --thin:#8a95a0;
  --work:#ff7266; --work-soft:rgba(255,114,102,.22);
  --st-ex:#dfe5ea; --st-ex-fg:#0f1418; --st-new:#2fc79d; --st-move:#f2a83a; --st-del:#ff6b6b; --mk-fg:#0f1418;
  --ok:#2fc79d; --warn:#f2a83a; --bad:#ff6b6b; --cote:#b99cff; --gh:#ff8a5c; --gh-fg:#1a0f0a; --hgt:#5ccbe0; --hgt-fg:#0f1418;
  --scrim:rgba(0,0,0,.5); --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#shell{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);min-height:0}
.top{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{min-width:0;flex:1}

.brand .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{flex:none;display:flex;align-items:center;gap:6px;min-width:0;max-width:40%;font-size:12px;color:var(--muted);white-space:nowrap;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.sync span{overflow:hidden;text-overflow:ellipsis}
.sync i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--st-new)} .sync.busy i{background:var(--st-move)} .sync.bad i{background:var(--st-del)}
.hbtn{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14px;position:relative}
.hbtn svg{width:18px;height:18px}
.hbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hbtn.quiet{background:var(--surface-2)}
.hbtn .badge{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--st-move);color:#fff;font-family:var(--f-mono);font-size:12px;font-weight:500;display:inline-grid;place-items:center}
main{position:relative;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.view.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;display:block}

/* ---------- plan */
.rooms{display:flex;gap:6px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto;scrollbar-width:none;background:var(--surface);border-bottom:1px solid var(--line)}
.rooms::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap}
.chip .c{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip[aria-pressed="true"] .c{color:var(--surface);opacity:.75}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg)}
#plan{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
#plan.placing{cursor:crosshair}
.room{stroke:none}
.room.gresie{fill:var(--fl-tile)} .room.parchet{fill:var(--fl-wood)}
.room.hl{fill:var(--accent-soft)}
.walls{fill:var(--wall);fill-rule:evenodd}
.thin{fill:none;stroke:var(--thin);stroke-width:.9px}
.thinbox{fill:none;stroke:var(--thin);stroke-width:1px}
.rlabel text{fill:var(--ink);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.rlabel .rn{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.02em}
.rlabel .ra{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.hatch-line{stroke:var(--work);stroke-width:.03}
.parapet{fill:url(#hatch);stroke:var(--work);stroke-width:1.2px}
.wk circle{fill:var(--surface);stroke:var(--work);stroke-width:1.5px}
.wk text{fill:var(--work);font-family:var(--f-mono);font-size:9.5px;font-weight:500;text-anchor:middle}
.wk.flash circle{fill:var(--work)} .wk.flash text{fill:var(--surface)}
.msrtxt{fill:var(--thin);font-family:var(--f-mono);font-size:.13px;text-anchor:middle}
.layer-off{display:none}

.cote line{stroke:var(--cote);stroke-width:1.2px}
.cote .tick{stroke:var(--cote);stroke-width:1.2px}
.cote .lb rect{fill:var(--surface);stroke:var(--cote);stroke-width:1px}
.cote .lb text{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink);text-anchor:middle}
.cote .lb .d{font-weight:600}
.cote{cursor:pointer}
.cote .hitl{stroke:transparent;stroke-width:22px;pointer-events:stroke}
.cote .lb .d.ok{fill:var(--ok)} .cote .lb .d.warn{fill:var(--warn)} .cote .lb .d.bad{fill:var(--bad)}
.cote.pending .lb text{fill:var(--muted)} .cote.pending .lb rect{stroke-dasharray:3 2}
.cote.m .lb rect{stroke-width:1.8px}
.cote.user .ln{stroke-dasharray:5 3}
.hc{cursor:pointer}
.hc .hit{fill:transparent}
.hc .dot{fill:var(--surface);stroke:var(--hgt);stroke-width:2.2px}
.hc rect{fill:var(--hgt)}
.hc text{fill:var(--hgt-fg);font-family:var(--f-mono);font-size:11px;font-weight:500;text-anchor:middle;pointer-events:none}
.rlabel .rh{font-family:var(--f-mono);font-size:10px;fill:var(--hgt)}
.gh{cursor:pointer}
.gh .hitl{stroke:transparent;stroke-width:22px;pointer-events:stroke}
.gh .ar{stroke:var(--gh);stroke-width:2px;opacity:.5}
.gh .ah{fill:var(--gh);opacity:.5}
.gh.next .ar{stroke-width:3px;opacity:1} .gh.next .ah{opacity:1}
.gh.done .ar{stroke:var(--ok);stroke-dasharray:4 3;opacity:.6}
.ghd circle{fill:var(--gh);stroke:var(--surface);stroke-width:2px;opacity:.7}
.gh.next .ghd circle{opacity:1}
.gh.done .ghd circle{fill:var(--ok);opacity:.85}
.ghd text{fill:var(--gh-fg);font-family:var(--f-mono);font-size:10.5px;font-weight:600;text-anchor:middle;pointer-events:none}
.gh.next .ghd text{font-size:12px}
.gone{fill:none;stroke:var(--muted);stroke-width:1px;stroke-dasharray:4 3}
.lchip.ghid{border-color:var(--gh)}
.ghbox{border:1.5px solid var(--gh);border-radius:10px;padding:10px 12px;margin:10px 0}
.ghbox .ghh{font-size:12px;color:var(--gh);font-weight:600;margin:0 0 6px}
.ghbox dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;margin:0;font-size:14px;line-height:1.45}
.ghbox dt{color:var(--muted)} .ghbox dd{margin:0}
.ghbox .help{margin-top:8px}
.cote .cst circle{fill:var(--cote);stroke:var(--surface);stroke-width:2px}
.cote .ah2{fill:var(--cote)}
.cote .mvl{stroke:var(--accent);stroke-width:2.5px;stroke-dasharray:none}
.cote .mvp rect{fill:var(--accent);stroke:var(--surface);stroke-width:1.5px}
.vecpre circle{fill:var(--cote);stroke:var(--surface);stroke-width:2px}
.cote.flash .lb rect{fill:var(--accent-soft);stroke-width:2px}
.far .lb,.far .olddeb-t{display:none}
.olddeb{fill:none;stroke:var(--cote);stroke-width:1.4px;stroke-dasharray:6 4}
.olddeb-t text{font-family:var(--f-display);font-size:12px;font-weight:600;fill:var(--cote);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:3px}

.mk{cursor:pointer}
.mk .hit{fill:transparent}
.mk .disc{fill:var(--st-ex);stroke:var(--surface);stroke-width:2px}
.mk .gl{color:var(--st-ex-fg)}
.mk.st-nou .disc{fill:var(--st-new)} .mk.st-nou .gl{color:var(--mk-fg)}
.mk.st-mutat .disc{fill:var(--st-move)} .mk.st-mutat .gl{color:var(--mk-fg)}
.mk.st-eliminat .disc{fill:var(--surface);stroke:var(--st-del);stroke-width:2.2px} .mk.st-eliminat .gl{color:var(--st-del)}
.mk .slash{stroke:var(--st-del);stroke-width:2.4px;stroke-linecap:round}
.mk .halo{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5px}
.mk .badge circle{fill:var(--surface);stroke:var(--ink);stroke-width:1.4px}
.mk .badge text{font-family:var(--f-mono);font-size:9px;font-weight:500;fill:var(--ink);text-anchor:middle}
.mk .defect circle{fill:var(--st-del)} .mk .defect text{font-family:var(--f-mono);font-size:9px;font-weight:600;fill:#fff;text-anchor:middle}
.mk .est{fill:var(--st-move);stroke:var(--surface);stroke-width:1.5px}
.mk.ghost .disc{fill:var(--surface);stroke:var(--st-move);stroke-width:2px;stroke-dasharray:3 2.5}
.mk.ghost .gl{color:var(--st-move)}
.mk.ghost .ah{fill:none;stroke:var(--st-move);stroke-width:2.2px;stroke-linecap:round;stroke-linejoin:round}
.mlabel text{font-family:var(--f-body);font-size:11.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3.2px;stroke-linejoin:round;pointer-events:none}
.mv{stroke:var(--st-move);stroke-width:2px;stroke-dasharray:5 4;fill:none}
.wallhl{stroke:var(--accent);stroke-width:5px;stroke-linecap:round;opacity:.7}
.cornerdot{fill:var(--accent);stroke:var(--surface);stroke-width:2px}
.dimline{stroke:var(--accent);stroke-width:1.6px;stroke-dasharray:4 3}
.dimlb rect{fill:var(--accent)} .dimlb text{fill:var(--accent-ink);font-family:var(--f-mono);font-size:11.5px;font-weight:500;text-anchor:middle}
.ms line{stroke:var(--accent);stroke-width:2px}
.ms .end{fill:var(--accent);stroke:var(--surface);stroke-width:2px}
.ms .lbl rect{fill:var(--accent)} .ms .lbl text{fill:var(--accent-ink);font-family:var(--f-mono);font-size:12px;font-weight:500;text-anchor:middle}

.ctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.ctl button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.ctl button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ctl svg{width:20px;height:20px}
.scalebar{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:12px;z-index:2;font-family:var(--f-mono);font-size:11px;color:var(--ink);pointer-events:none}
.scalebar .bar{height:6px;border:1.5px solid var(--ink);border-top:0;margin-top:2px}
.hint{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:66px;top:12px;z-index:3;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--ink);color:var(--surface);font-size:14.5px;box-shadow:var(--shadow)}
.hint span{flex:1;min-width:0}
.hint button{flex:none;border:0;border-radius:8px;padding:8px 12px;background:var(--surface);color:var(--ink);font-weight:600;font-size:14px}
.coach{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:14px;z-index:2;max-width:440px;margin-inline:auto;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.12);display:grid;gap:8px}
.coach ol{margin:0;padding-left:20px;display:grid;gap:3px}
.coach .row{justify-content:flex-end}
.coach b{font-weight:600}

.palette{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--surface);border-top:1px solid var(--line)}
.pal{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;padding:6px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:600;line-height:1.1;text-align:center}
.pal svg{width:24px;height:24px}
.pal[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pal.main{background:var(--surface);border-width:1.5px;border-color:var(--ink)}
.pal.main[aria-pressed="true"]{border-color:var(--accent)}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{border:0;background:none;padding:9px 2px 10px;font-family:var(--f-display);font-weight:600;font-size:15.5px;letter-spacing:.03em;color:var(--muted);position:relative;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::before{content:"";position:absolute;left:24%;right:24%;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab .cnt{font-family:var(--f-mono);font-size:11px;font-weight:400;margin-left:3px;color:var(--muted)}

/* ---------- sheets */
.sheet{position:fixed;left:0;right:0;bottom:var(--kb);z-index:20;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:62%;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);border-top:1px solid var(--line)}
.sheet.full{max-height:92%}
.sheet-head{display:flex;align-items:center;gap:10px;padding:6px 16px 8px;border-bottom:1px solid var(--line);position:relative}
.grab{position:absolute;left:50%;top:0;transform:translateX(-50%);width:80px;height:22px;border:0;background:none;padding:0}
.grab::after{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:7px auto 0}
.sh-title{flex:1;display:flex;align-items:center;gap:10px;min-width:0;padding-top:12px}
.sh-ic{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--st-ex);color:var(--st-ex-fg)}
.sh-ic svg{width:20px;height:20px}
.sh-ic.st-nou{background:var(--st-new);color:var(--mk-fg)} .sh-ic.st-mutat{background:var(--st-move);color:var(--mk-fg)} .sh-ic.st-eliminat{background:var(--surface);color:var(--st-del);box-shadow:inset 0 0 0 2px var(--st-del)}
.sh-ic.plain{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.sh-type{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-where{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-title>div{min-width:0}
.btn{min-height:40px;padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--st-del)}
.btn.danger.armed{background:var(--st-del);border-color:var(--st-del);color:#fff}
.btn.wide{width:100%}
.btn svg{width:17px;height:17px;flex:none}
.btn:disabled{opacity:.5;cursor:default}
.sh-done{margin-top:12px}
.sh-min{margin-top:12px}
.sheet-head{touch-action:none}
.sheet.mini .sheet-body{display:none}
.sheet.mini .sh-min svg{transform:rotate(180deg)}
.sheet.mini .sh-title{cursor:pointer}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:12px 16px 18px;display:grid;gap:16px;-webkit-overflow-scrolling:touch}
.fld{display:grid;gap:7px;min-width:0}
.fld>label,.fld>.lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:3px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{border:0;border-radius:8px;background:none;padding:8px 2px;font-size:13px;font-weight:600;color:var(--muted);line-height:1.15}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button[data-v="existent"][aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--st-ex),0 1px 3px rgba(0,0,0,.12)}
.seg button[data-v="nou"][aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--st-new),0 1px 3px rgba(0,0,0,.12)}
.seg button[data-v="mutat"][aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--st-move),0 1px 3px rgba(0,0,0,.12)}
.seg button[data-v="eliminat"][aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--st-del),0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.opt{min-height:36px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.opt.sug{border-style:dashed;color:var(--muted)}
.opt small{font-family:var(--f-mono);font-size:11px;opacity:.75;margin-left:3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp{min-height:42px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);min-width:0}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inp.n{width:96px;font-family:var(--f-mono)}
textarea.inp{width:100%;min-height:64px;resize:vertical}
input.inp.w{width:100%}
.inp.big{font-size:17px;font-weight:500}
.unit{font-size:13px;color:var(--muted)}
.help{font-size:13px;color:var(--muted)}
.help b{color:var(--ink);font-weight:600}
.warnbox{font-size:13.5px;padding:8px 10px;border-radius:9px;background:var(--work-soft);color:var(--ink)}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--st-del);flex:none}
.fld>label.check{font-size:14px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.thumb{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);padding:0;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.up{display:grid;place-items:center;font-size:11px;color:var(--muted)}
.addph{display:grid;place-items:center;gap:2px;aspect-ratio:1;border-radius:9px;border:1.5px dashed var(--line);background:none;font-size:12px;font-weight:600;color:var(--muted);max-width:100%}
.addph svg{width:22px;height:22px}
.sh-foot{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.sh-foot .sp{flex:1}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:19}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.typebtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:600;text-align:center;line-height:1.15}
.typebtn svg{width:24px;height:24px}
.grp-h{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:2px 0 -6px}
details.more{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.more>summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:space-between}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"+";font-family:var(--f-mono);font-size:18px;color:var(--muted)}
details.more[open]>summary::after{content:"−"}
details.more>.in{padding:2px 14px 14px;display:grid;gap:16px}

/* measurement card */
.meascard{display:grid;gap:10px;padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.meascard .hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.meascard .hd .t{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mstate{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.mstate.ok{border-color:var(--ok);color:var(--ok)}
.mstate.est{border-color:var(--warn);color:var(--warn)}
.elev{max-width:100%;height:auto;display:block;margin-inline:auto;background:var(--surface);border:1px solid var(--line);border-radius:9px}
.elev .wallr{fill:var(--surface);stroke:var(--thin);stroke-width:1}
.elev .floor{stroke:var(--ink);stroke-width:2}
.elev .ceil{stroke:var(--thin);stroke-width:1;stroke-dasharray:4 3}
.elev .corner{stroke:var(--accent);stroke-width:3}
.elev .other circle{fill:var(--surface-2);stroke:var(--muted);stroke-width:1.2}
.elev .me circle{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.elev .me.est circle{fill:var(--surface);stroke:var(--warn);stroke-width:2;stroke-dasharray:3 2}
.elev .dim{stroke:var(--accent);stroke-width:1.2}
.elev text{font-family:var(--f-mono);font-size:11px;fill:var(--ink)}
.elev .tl{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.elev .cl{font-family:var(--f-body);font-size:11px;font-weight:600;fill:var(--accent)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfield{display:grid;gap:4px;min-width:0}
.mfield label{font-size:13px;font-weight:600;color:var(--ink);line-height:1.2}
.mfield .box{display:flex;align-items:center;gap:6px}
.mfield input{width:100%;min-width:0;font-family:var(--f-mono);font-size:20px;font-weight:500;min-height:48px;padding:6px 10px;text-align:right}
.mfield input::placeholder{color:var(--warn);opacity:.8}
.mfield .unit{flex:none}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:13.5px;padding:6px 4px;text-align:left}

/* ---------- lists */
.wrap{max-width:920px;margin-inline:auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.wrap h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;text-wrap:balance}
.wrap h3{text-wrap:balance}
.lede{margin:-10px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;gap:2px}
.tile .k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .k svg{width:16px;height:16px}
.tile .v{font-family:var(--f-mono);font-size:24px;font-weight:500;line-height:1.15}
.tile .s{font-size:12.5px;color:var(--muted)}
.stbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.stbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.d-existent{background:var(--st-ex)} .d-nou{background:var(--st-new)} .d-mutat{background:var(--st-move)} .d-eliminat{background:var(--surface);box-shadow:inset 0 0 0 2px var(--st-del)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0;background:var(--surface-2)}
td.z{color:var(--line)}
td.wrapc{white-space:normal;text-align:left;min-width:180px;color:var(--muted);font-size:13px}
table.cotes td:first-child{white-space:normal;min-width:130px}
table.cotes th,table.cotes td{padding:8px 8px}
tr.go{cursor:pointer}
.dpill{display:inline-block;min-width:46px;padding:2px 6px;border-radius:999px;font-family:var(--f-mono);font-size:12px;font-weight:500;text-align:center;border:1px solid}
.dpill.ok{color:var(--ok);border-color:var(--ok)} .dpill.warn{color:var(--warn);border-color:var(--warn)} .dpill.bad{color:var(--bad);border-color:var(--bad)}
.filt{display:flex;gap:6px;flex-wrap:wrap}
.rgroup{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.rhead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.rhead h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:18px;flex:1;min-width:0}
.rhead .meta{font-size:12.5px;color:var(--muted)}
.irow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.irow:last-child{border-bottom:0}
.irow .ic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--st-ex);color:var(--st-ex-fg)}
.irow .ic svg{width:17px;height:17px}
.irow .ic.st-nou{background:var(--st-new);color:var(--mk-fg)} .irow .ic.st-mutat{background:var(--st-move);color:var(--mk-fg)} .irow .ic.st-eliminat{background:var(--surface);color:var(--st-del);box-shadow:inset 0 0 0 2px var(--st-del)}
.irow .tx{flex:1;min-width:0}
.irow .t1{font-weight:600;font-size:14.5px}
.irow .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pill{flex:none;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.defect{border-color:var(--st-del);color:var(--st-del)}
.pill.est{border-color:var(--warn);color:var(--warn)}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.empty{padding:18px;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14.5px}
.empty b{color:var(--ink)}
.card{padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;gap:10px;min-width:0}
.card h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:19px}
.card p{margin:0}
.qrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.qrow:first-of-type{border-top:0}
.qrow .qv{font-family:var(--f-mono);text-align:right}
.qrow .qn{grid-column:1/-1;font-size:13px;color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.steps{display:grid;gap:12px}
.step{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.step>*:not(.no){grid-column:2;min-width:0}
.step .no{grid-column:1;grid-row:1 / span 6;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:13px;border:1.5px solid var(--accent);color:var(--accent)}
.step h4{margin:3px 0 0;font-size:15px}
.step p{margin:0;font-size:13.5px;color:var(--muted)}
.step .row{margin-top:4px}
.olist{margin:0;padding-left:20px;display:grid;gap:6px;font-size:13.5px}
.help.warn{padding:8px 10px;border-radius:9px;background:var(--work-soft);color:var(--ink)}
.fname{font-family:var(--f-mono);font-size:13px;padding:8px 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);word-break:break-all}
.sumlist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.sumlist li{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.sumlist li:last-child{border-bottom:0}
.sumlist b{font-family:var(--f-mono);font-weight:500}
.prog{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}

.works{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.work{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.work .no{font-family:var(--f-mono);font-weight:500;font-size:13px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--work);color:var(--work);grid-row:span 3}
.work.gata .no{background:var(--st-new);border-color:var(--st-new);color:var(--mk-fg)}
.work .wt{font-size:15px;font-weight:500;line-height:1.35}
.work.gata .wt{color:var(--muted)}
.work .wq{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.work .flag{font-size:13px;padding:8px 10px;border-radius:9px;background:var(--work-soft);color:var(--ink)}
.work .wctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.work .seg{grid-template-columns:repeat(4,auto);display:inline-grid}
.work .seg button{padding:6px 9px;font-size:12.5px}
.work textarea{grid-column:2}
.wnote{grid-column:2}

.lightbox{position:fixed;inset:0;z-index:40;background:rgba(5,8,10,.92);display:flex;flex-direction:column}
.lightbox img{flex:1;min-height:0;object-fit:contain;width:100%}
.lb-bar{display:flex;gap:8px;justify-content:space-between;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.lb-bar .btn{background:#222a31;border-color:#39434c;color:#fff}
.lb-bar .btn.danger.armed{background:#c22f2f;border-color:#c22f2f}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);padding:10px 12px 10px 16px;border-radius:12px;background:var(--ink);color:var(--surface);font-size:14px;box-shadow:var(--shadow)}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:700;padding:4px 6px}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13.5px;background:var(--accent-soft);color:var(--ink);border-bottom:1px solid var(--line)}
.banner span{flex:1;min-width:200px}
.banner .btn{min-height:34px;padding:4px 12px}
body.ro .palette,body.ro .ed-only{display:none!important}
body.filemode .cloud-only{display:none!important}
body:not(.filemode) .file-only{display:none!important}

/* layer controls: a labelled button, removable chips for what is switched away from the default, a switch list */
.lrow{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:66px;top:12px;z-index:3;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
.lrow>*,.lchips>*{pointer-events:auto}
.lchips{display:contents}
.lbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.lbtn svg{width:18px;height:18px}
.lbtn[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.lchip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 6px 4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.lchip .x{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);color:var(--muted)}
.lchip .x svg{width:13px;height:13px}
.lchip.add{padding:4px 12px 4px 6px;border-style:dashed;color:var(--muted)}
.lchip.cote{border-color:var(--cote)} .lchip.works{border-color:var(--work)}
.lpop{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:60px;z-index:6;width:min(330px,calc(100% - 84px));max-height:calc(100% - 72px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:4px 0}
.lp-h{padding:10px 14px 4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sw-row{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 14px;border:0;background:none;text-align:left;font-size:15px;font-weight:500}
.sw-row .tx{flex:1;min-width:0;line-height:1.25}
.sw-row .tx small{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}
.tog{flex:none;width:42px;height:26px;border-radius:999px;background:var(--line);position:relative}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw-row[aria-checked="true"] .tog{background:var(--accent)}
.sw-row[aria-checked="true"] .tog::after{transform:translateX(16px)}
.lpop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.sw-row.link{color:var(--accent);font-weight:600;min-height:44px}

/* measurements tab */
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.mseg{max-width:420px}
.wrap h3.sec{margin:6px 2px -8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mlist{display:grid;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;min-width:0}
details.more .mlist{border-radius:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow.done{box-shadow:inset 3px 0 0 var(--ok)}
.mrow .tx{min-width:0}
.mrow .tx b{display:block;font-weight:600;font-size:14.5px;line-height:1.25}
.mrow .t2{display:block;margin-top:2px;font-size:12.5px;color:var(--muted)}
.mrow .mval{display:flex;align-items:center;gap:6px}
.mrow .mval input{width:88px;min-height:44px;padding:6px 8px;font-family:var(--f-mono);font-size:17px;text-align:right}
.mrow .res{grid-column:1/-1;font-family:var(--f-mono);font-size:12px;color:var(--ok)}
.mrow .res:empty{display:none}
.iconbtn{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;padding:0}
.iconbtn svg{width:19px;height:19px}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:6px}
.vals>div{display:grid;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.vals span{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.vals b{font-size:17px;font-weight:500}
.vals .now{border-color:var(--ok);box-shadow:inset 0 -3px 0 var(--ok)}
.three{position:relative;min-height:260px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);touch-action:none}
.three canvas{display:block;width:100%;touch-action:none}
.three-msg{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--muted)}
.three-hint{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);padding:4px 8px;border-radius:8px;background:var(--surface);opacity:.88;font-size:12px;color:var(--muted);pointer-events:none}
.rooms3{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.sw-sub{padding:0 14px 8px 14px}
label.btn,label.addph{cursor:pointer;-webkit-user-select:none;user-select:none}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;opacity:0}

@media (min-width:900px){

/* ---------- geometry */
function pointInPoly(p, poly) {
  let ins = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if (((yi > p[1]) !== (yj > p[1])) && (p[0] < (xj - xi) * (p[1] - yi) / (yj - yi) + xi)) ins = !ins;
  }
  return ins;
}
function roomAt(p) { const r = ROOMS.find(r => pointInPoly(p, r.poly)); return r ? r.id : null; }
function nearestWall(p, onlyRoom) {
  let best = null;
  for (const r of ROOMS) {
    if (onlyRoom && r.id !== onlyRoom) continue;
    const P = r.poly;
    for (let e = 0; e < P.length; e++) {
      const a = P[e], b = P[(e + 1) % P.length];
      const abx = b[0] - a[0], aby = b[1] - a[1], L2 = abx * abx + aby * aby;
      if (L2 < 0.04) continue; // ignoră muchiile scurte de la praguri
      const t = clamp(((p[0] - a[0]) * abx + (p[1] - a[1]) * aby) / L2, 0, 1);
      const q = [a[0] + t * abx, a[1] + t * aby];
      const d = Math.hypot(p[0] - q[0], p[1] - q[1]);
      if (!best || d < best.d) best = {room: r.id, e, t, d, q, L: Math.sqrt(L2)};
    }
  }
  return best;
}
/* A wall as the person inside the room sees it: inward normal, and which end is the left corner when facing the wall. */
const wfCache = new Map();
function wallFrame(roomId, e) {
  const k = roomId + ':' + e; if (wfCache.has(k)) return wfCache.get(k);
  const P = ROOM_BY[roomId].poly, a = P[e], b = P[(e + 1) % P.length];
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1e-6, u = [dx / L, dy / L];
  const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  let n = [-u[1], u[0]];
  if (!pointInPoly([m[0] + n[0] * 0.04, m[1] + n[1] * 0.04], P)) n = [u[1], -u[0]];
  const f = [-n[0], -n[1]]; // privirea, spre perete
  const cross = c => f[0] * (c[1] - m[1]) - f[1] * (c[0] - m[0]); // y în jos: stânga dă negativ
  const leftIdx = cross(a) < 0 ? 0 : 1;
  const fr = {room: roomId, e, a, b, L, u, n, m, leftIdx};
  wfCache.set(k, fr); return fr;
}

  const side = it.wall.side === 'R' ? 'R' : 'L';
  const cIdx = side === 'L' ? F.leftIdx : 1 - F.leftIdx;
  const corner = cIdx === 0 ? F.a : F.b;
  const distPlan = (cIdx === 0 ? it.wall.t : 1 - it.wall.t) * F.L;

}

}

const LS_DATA = 'releveu-instalatii-date-v1', LS_OUT = 'releveu-instalatii-outbox-v1', LS_UI = 'releveu-instalatii-ui-v3';

function persist(path, data, delay = 450) {

function queueWrite(path, data, delay = 450) {

  setSync();

function flushPath(path, data) {

  if (storeMode === 'local') { saveLocal(); pending.delete(path); setSync(); return; }
  if (storeMode === 'readonly' || storeMode === 'file') { pending.delete(path); setSync(); return; }
  const prev = chains.get(path) || Promise.resolve();
  const p = prev.then(() => writeOnce(path, data)).finally(() => {

    setSync();

function setFromPath(path, data) {

  if (col === 'items') { if (data === null) st.items.delete(id); else st.items.set(id, normalizeItem({...JSON.parse(JSON.stringify(data)), id})); }
  else if (col === 'rooms') { if (data === null) delete st.rooms[id]; else st.rooms[id] = JSON.parse(JSON.stringify(data)); }
  else if (col === 'works') { if (data === null) delete st.works[id]; else st.works[id] = JSON.parse(JSON.stringify(data)); }

  cap.db.collection(col).onSnapshot(snap => {

      setFromPath(path, ch.type === 'removed' ? null : ch.doc.data());

const AS_PREFIX = 'releveu-fisier-';

const idb = (() => {

    const db = await open();

      t.oncomplete = () => res(rq ? rq.result : undefined); t.onerror = t.onabort = () => rej(t.error);
    });

    get: k => run('readonly', o => o.get(k)).catch(() => null),
    set: (k, v) => run('readwrite', o => o.put(v, k)).then(() => true, () => false),
    all: () => run('readonly', o => o.getAll()).catch(() => []),

async function photoDataURL(id) {
  if (st.blobs[id]) return st.blobs[id];
  try {
    const r = await fetch('/_blob/' + id); if (!r.ok) throw 0;
    return await blobToDataURL(await shrink(await r.blob(), 1400, 0.72));
  } catch {
    try {
      const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = '/_blob/' + id; });
      const s = Math.min(1, 1400 / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', 0.72);
    } catch { return null; }
  }
}

function planImport(d) {
  const P = {add: [], upd: [], older: [], same: 0, gone: [], del: [], rooms: [], works: [], meas: [], measDel: [], photos: 0};
  const created = (d.doc && d.doc.created) || 0;
  for (const [id, raw] of Object.entries(d.items || {})) {
    const cur = st.items.get(id);
    if (!cur) { if ((raw.updated || 0) > created || (raw.created || 0) > created) P.add.push(id); else P.gone.push(id); }
    else if ((raw.updated || 0) > (cur.updated || 0)) P.upd.push(id);
    else if ((raw.updated || 0) < (cur.updated || 0)) P.older.push(id);
    else P.same++;
  }
  for (const [id, ts] of Object.entries(d.deleted || {})) { const cur = st.items.get(id); if (cur && ts > (cur.updated || 0)) P.del.push(id); }
  for (const [id, raw] of Object.entries(d.rooms || {})) if ((raw.updated || 0) > ((st.rooms[id] || {}).updated || 0)) P.rooms.push(id);
  for (const [id, raw] of Object.entries(d.works || {})) if ((raw.updated || 0) > ((st.works[id] || {}).updated || 0)) P.works.push(id);
  for (const [id, raw] of Object.entries(d.measures || {})) if (raw && (raw.updated || 0) > ((st.measures[id] || {}).updated || 0)) P.meas.push(id);
  const photoIds = new Set();
  for (const id of [...P.add, ...P.upd]) (d.items[id].photos || []).forEach(p => { if (!/^[0-9a-f]{32}$/.test(p) && d.blobs && d.blobs[p]) photoIds.add(p); });
  for (const id of P.rooms) (d.rooms[id].photos || []).forEach(p => { if (!/^[0-9a-f]{32}$/.test(p) && d.blobs && d.blobs[p]) photoIds.add(p); });
  P.photos = photoIds.size;
  return P;
}

function wallPaintCalc() {
  let walls = 0, bath = 0, assumed = 0;
  for (const r of ROOMS) {
    const P = r.poly; let per = 0;
    for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length]; per += Math.hypot(b[0] - a[0], b[1] - a[1]); }
    const ceil = (st.rooms[r.id] && st.rooms[r.id].ceil) || null;
    if (!ceil) assumed++;
    const a = per * (ceil || DEFAULT_CEIL) / 100;
    walls += a; if (r.id === 'baie') bath = a;
  }
  return {walls, bath, assumed};
}
function perim(ids) {
  let s = 0;
  for (const r of ROOMS.filter(r => ids.includes(r.id))) { const P = r.poly; for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length]; s += Math.hypot(b[0] - a[0], b[1] - a[1]); } }
  return s;
}

    const a1 = Math.atan2(v[1] - p[1], v[0] - p[0]), a2 = Math.atan2(q[1] - v[1], q[0] - v[0]);
    let d = Math.abs(a2 - a1); if (d > Math.PI) d = 2 * Math.PI - d; return d;

      if (turn(k, H) < 0.35) { H.splice(k, 1); changed = true; break; }

function tokenColor(T, name, fb) { const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); try { return new T.Color(v || fb); } catch { return new T.Color(fb); } }
